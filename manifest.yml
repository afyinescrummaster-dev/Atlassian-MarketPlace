modules:
  jira:issuePanel:
    - key: atlassian-first-app-test-hello-world-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Issue Data Test
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:projectPage:
    - key: project-health-report-page
      resource: project-report
      resolver:
        function: resolver
      render: native
      title: Project Health Report
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:projectSettingsPage:
    - key: executive-report-preview-page
      resource: executive-preview
      resolver:
        function: resolver
      title: Executive Report Preview
      layout: blank
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:adminPage:
    - key: admin-health-lab-page
      resource: admin-health
      resolver:
        function: resolver
      title: Admin Health
      layout: blank
      # Surfaces a Configure button on admin.atlassian.com Connected Apps
      # (Jira Settings → Apps now redirects there and hides plain admin pages).
      useAsConfig: true
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
  - key: project-report
    path: src/frontend/project-report.jsx
  - key: executive-preview
    path: static/executive-preview/build
  - key: admin-health
    path: static/admin-health/build
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/c3817645-72ab-47cf-8c1c-a1dff1b69cff
permissions:
  scopes:
    # Browse projects, project search (incl. insight/lead expand), and field catalog.
    # Used by Project Health, Executive Preview, Issue panel, and Jira Admin Health.
    - read:jira-work
    # Field mapping persistence + Admin Health inactivity threshold preference.
    - storage:app
