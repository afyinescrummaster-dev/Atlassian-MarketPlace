modules:
  jira:issuePanel:
    - key: atlassian-first-app-test-hello-world-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Hello World
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  # Replace this placeholder with the Forge app ID generated by `forge create`.
  id: ari:cloud:ecosystem::app/REPLACE_WITH_FORGE_APP_ID